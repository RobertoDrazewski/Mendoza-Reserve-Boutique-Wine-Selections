<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- Favicons & app icons (all sizes, generated from the Mendoza Reserve mark) -->
    <link rel="icon" href="%PUBLIC_URL%/images/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/images/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/images/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/images/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/images/android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="%PUBLIC_URL%/images/android-chrome-512x512.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#722f37" />

    <!-- iOS "Add to Home Screen" -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mendoza Reserve" />

    <meta
      name="description"
      content="Mendoza Reserve — a curated marketplace connecting independent boutique wineries in Mendoza, Argentina directly with restaurants, importers and wine buyers across the United Kingdom."
    />

    <!-- Open Graph / link previews (WhatsApp, Slack, iMessage, LinkedIn, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mendoza Reserve" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:url" content="https://mendoza-reserve.co.uk/" />
    <meta property="og:title" content="Mendoza Reserve — Boutique Wine Selections" />
    <meta
      property="og:description"
      content="Independent Mendoza wineries, direct to the UK trade. Discover hand-selected boutique wines from Argentina's finest small producers."
    />
    <meta property="og:image" content="https://mendoza-reserve.co.uk/images/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mendoza Reserve — Boutique Wine Selections" />
    <meta
      name="twitter:description"
      content="Independent Mendoza wineries, direct to the UK trade."
    />
    <meta name="twitter:image" content="https://mendoza-reserve.co.uk/images/og-image.jpg" />

    <title>Mendoza Reserve — Boutique Wine Selections from Mendoza, Argentina</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <div id="root"></div>

  </body>
</html>
